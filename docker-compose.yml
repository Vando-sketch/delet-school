version: '3.9'

services:
  tailscale:
    build:
      context: .
      dockerfile: docker/tailscale/Dockerfile
    container_name: delet-school-tailscale
    hostname: ${TS_HOSTNAME:-delet-school}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=--advertise-tags=tag:delet-school
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_SERVE=${TS_SERVE:-false}
      - TS_SERVE_PORT=${WEB_PORT:-3000}
      - TAILDROP_STAGING_DIR=${TAILDROP_STAGING_DIR:-/taildrop-staging}
      - TAILDROP_POLL_INTERVAL_MS=${TAILDROP_POLL_INTERVAL_MS:-5000}
    ports:
      # Exposes Web Dashboard on host port 3000 (accessible on local LAN & tailnet)
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - taildrop-staging:${TAILDROP_STAGING_DIR:-/taildrop-staging}
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "tailscale", "status", "--json" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: delet-school-redis
    command: redis-server --appendonly yes
    network_mode: "service:tailscale"
    volumes:
      - redis-data:/data
    depends_on:
      tailscale:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  ingest:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: delet-school-ingest
    command: npm run start:ingest
    env_file: .env
    environment:
      - NODE_ENV=production
    network_mode: "service:tailscale"
    volumes:
      - "${INGEST_WATCH_DIR_HOST:-./inbox}:${INGEST_WATCH_DIR:-/app/inbox}"
      - taildrop-staging:${TAILDROP_STAGING_DIR:-/taildrop-staging}
    depends_on:
      tailscale:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: delet-school-worker
    command: npm run start:worker
    env_file: .env
    environment:
      - NODE_ENV=production
    network_mode: "service:tailscale"
    volumes:
      - "${INGEST_WATCH_DIR_HOST:-./inbox}:${INGEST_WATCH_DIR:-/app/inbox}"
      - "${AGY_CREDENTIAL_DIR_HOST:?Set AGY_CREDENTIAL_DIR_HOST to an absolute host path for agy's pre-authenticated ~/.gemini dir}:/home/nodejs/.gemini"
    depends_on:
      tailscale:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: delet-school-web
    command: npm run start:web
    env_file: .env
    environment:
      - NODE_ENV=production
      - WEB_PORT=${WEB_PORT:-3000}
    network_mode: "service:tailscale"
    volumes:
      - "${INGEST_WATCH_DIR_HOST:-./inbox}:${INGEST_WATCH_DIR:-/app/inbox}"
      - banking-data:/app/data/banking
    depends_on:
      tailscale:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
  tailscale-state:
    driver: local
  taildrop-staging:
    driver: local
  banking-data:
    driver: local
